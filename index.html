<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KERLOS AYMEN — Web Developer</title>
  <meta name="description" content="Portfolio of Kerlos Aymen Fathy: web developer, programmer and tech enthusiast.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;700;800&family=Cairo:wght@400;600;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #081713;
      --card: #102820;
      --em: #00A878;
      --mint: #9BE8C5;
      --tx: #F4F7F5;
      --mut: #9fb8ae;
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 72px
    }

    body {
      background: radial-gradient(900px 500px at 80% -10%, #0f3a2c 0, transparent 60%), var(--bg);
      color: var(--tx);
      font: 400 16px/1.7 Sora, Cairo, system-ui, sans-serif;
      overflow-x: hidden
    }

    [dir=rtl] body,
    [dir=rtl] button,
    [dir=rtl] input,
    [dir=rtl] textarea {
      font-family: Cairo, Sora, sans-serif
    }

    a {
      color: inherit;
      text-decoration: none
    }

    :focus-visible {
      outline: 2px solid var(--mint);
      outline-offset: 3px
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 5vw;
      background: rgba(8, 23, 19, .72);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(155, 232, 197, .12)
    }

    .logo {
      font-weight: 800;
      letter-spacing: .06em;
      color: var(--mint)
    }

    nav {
      display: flex;
      gap: 22px;
      font-size: 14px;
      color: var(--mut)
    }

    nav a:hover {
      color: var(--tx)
    }

    .lang {
      border: 1px solid var(--em);
      background: transparent;
      color: var(--mint);
      padding: 6px 14px;
      border-radius: 99px;
      cursor: pointer;
      font-weight: 600
    }

    .lang:hover {
      background: var(--em);
      color: #04120d
    }

    section {
      padding: 96px 5vw;
      max-width: 1180px;
      margin: auto
    }

    h2 {
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 700;
      margin-bottom: 32px
    }

    .hero {
      min-height: calc(100svh - 60px);
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 40px;
      padding-top: 40px
    }

    .hero h1 {
      font-size: clamp(40px, 7.5vw, 84px);
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -.02em
    }

    [dir=rtl] .hero h1 {
      letter-spacing: 0;
      line-height: 1.25
    }

    .role {
      margin: 18px 0 8px;
      color: var(--mint);
      font-weight: 500;
      font-size: clamp(15px, 2vw, 19px)
    }

    .lead {
      color: var(--mut);
      max-width: 46ch;
      margin-bottom: 30px
    }

    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 12px
    }

    .btn {
      padding: 13px 26px;
      border-radius: 14px;
      font-weight: 600;
      border: 1px solid var(--em);
      transition: .25s
    }

    .btn.p {
      background: var(--em);
      color: #04120d;
      box-shadow: 0 0 28px rgba(0, 168, 120, .35)
    }

    .btn.p:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 34px rgba(0, 168, 120, .55)
    }

    .btn.s:hover {
      background: rgba(0, 168, 120, .15)
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      perspective: 900px;
      min-height: 380px
    }

    .frame {
      width: min(300px, 70vw);
      aspect-ratio: 4/5;
      border-radius: 36% 12% 36% 12%;
      border: 2px solid var(--em);
      background: linear-gradient(160deg, #143a2d, var(--card));
      box-shadow: 0 0 60px rgba(0, 168, 120, .35), inset 0 0 40px rgba(155, 232, 197, .08);
      display: grid;
      place-items: center;
      overflow: hidden;
      transform: rotateY(-10deg) rotateX(4deg);
      transition: transform .5s
    }

    [dir=rtl] .frame {
      transform: rotateY(10deg) rotateX(4deg);
      border-radius: 12% 36% 12% 36%
    }

    .frame:hover {
      transform: rotateY(0) rotateX(0)
    }

    .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .mono {
      font-size: 120px;
      font-weight: 800;
      color: var(--mint);
      opacity: .85
    }

    .cube {
      position: absolute;
      width: 64px;
      height: 64px;
      transform-style: preserve-3d;
      animation: spin 14s linear infinite;
      inset-block-start: 4%;
      inset-inline-start: 2%
    }

    .cube i {
      position: absolute;
      inset: 0;
      border: 1.5px solid var(--mint);
      background: rgba(0, 168, 120, .14);
      box-shadow: 0 0 18px rgba(0, 168, 120, .4)
    }

    .cube i:nth-child(1) {
      transform: translateZ(32px)
    }

    .cube i:nth-child(2) {
      transform: rotateY(180deg) translateZ(32px)
    }

    .cube i:nth-child(3) {
      transform: rotateY(90deg) translateZ(32px)
    }

    .cube i:nth-child(4) {
      transform: rotateY(-90deg) translateZ(32px)
    }

    .cube i:nth-child(5) {
      transform: rotateX(90deg) translateZ(32px)
    }

    .cube i:nth-child(6) {
      transform: rotateX(-90deg) translateZ(32px)
    }

    .cube.b {
      inset: auto 4% 6% auto;
      width: 44px;
      height: 44px;
      animation-duration: 10s;
      animation-direction: reverse
    }

    .cube.b i {
      transform-origin: center
    }

    @keyframes spin {
      to {
        transform: rotateX(360deg) rotateY(360deg)
      }
    }

    .tag {
      text-align: center;
      color: var(--mut);
      font-size: 13px;
      letter-spacing: .3em;
      padding-bottom: 12px
    }

    .glass {
      background: rgba(16, 40, 32, .7);
      border: 1px solid rgba(155, 232, 197, .16);
      border-radius: 20px;
      padding: 26px;
      backdrop-filter: blur(10px);
      transition: .3s
    }

    .glass:hover {
      border-color: var(--em);
      box-shadow: 0 0 30px rgba(0, 168, 120, .2);
      transform: translateY(-4px)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px
    }

    .glass h3 {
      font-size: 19px;
      margin-bottom: 8px;
      color: var(--mint)
    }

    .glass p {
      color: var(--mut);
      font-size: 15px
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px
    }

    .chips span {
      font-size: 12px;
      padding: 3px 11px;
      border-radius: 99px;
      background: rgba(0, 168, 120, .16);
      color: var(--mint)
    }

    .about {
      max-width: 68ch;
      color: var(--mut);
      font-size: 17px
    }

    .skill {
      margin-bottom: 6px
    }

    .skill div {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 15px
    }

    .bar {
      height: 6px;
      border-radius: 9px;
      background: #0b211a;
      margin-top: 8px;
      overflow: hidden
    }

    .bar b {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 9px;
      background: linear-gradient(90deg, var(--em), var(--mint));
      transition: width 1.2s cubic-bezier(.2, .8, .2, 1)
    }

    .note {
      font-size: 13px;
      color: var(--mut);
      margin-top: 16px
    }

    form {
      display: grid;
      gap: 14px;
      max-width: 560px
    }

    input,
    textarea {
      width: 100%;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid rgba(155, 232, 197, .2);
      background: #0b211a;
      color: var(--tx);
      font: inherit
    }

    input:focus,
    textarea:focus {
      border-color: var(--em);
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 168, 120, .25)
    }

    button.btn {
      cursor: pointer;
      font: inherit;
      font-weight: 600
    }

    .err {
      color: #ff9d9d;
      font-size: 13px;
      min-height: 18px
    }

    footer {
      text-align: center;
      padding: 40px 5vw;
      color: var(--mut);
      border-top: 1px solid rgba(155, 232, 197, .1);
      font-size: 14px
    }

    @media(max-width:820px) {
      nav {
        display: none
      }

      .hero {
        grid-template-columns: 1fr;
        text-align: start
      }

      .stage {
        order: -1;
        min-height: 320px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }

      html {
        scroll-behavior: auto
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="#home">KERLOS AYMEN</a>
    <nav aria-label="Main">
      <a href="#home" data-i="n_home"></a><a href="#about" data-i="n_about"></a><a href="#skills"
        data-i="n_skills"></a><a href="#projects" data-i="n_projects"></a><a href="#services" data-i="n_services"></a><a
        href="#contact" data-i="n_contact"></a>
    </nav>
    <button class="lang" id="lang" aria-label="Switch language">العربية</button>
  </header>

  <main>
    <section id="home" class="hero">
      <div>
        <h1>KERLOS<br>AYMEN</h1>
        <p class="role" data-i="role"></p>
        <p class="lead" data-i="lead"></p>
        <div class="btns">
          <a class="btn p" href="#projects" data-i="b_proj"></a>
          <a class="btn s" href="#contact" data-i="b_contact"></a>
        </div>
      </div>
      <div class="stage" aria-hidden="true">
        <div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="cube b"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="frame"><span class="mono">K</span></div>
      </div>
    </section>
    <p class="tag">DREAM. BUILD. INNOVATE.</p>

    <section id="about">
      <h2 data-i="n_about"></h2>
      <p class="about" data-i="about"></p>
    </section>

    <section id="skills">
      <h2 data-i="n_skills"></h2>
      <div class="grid" id="skillGrid"></div>
      <p class="note" data-i="skillNote"></p>
    </section>

    <section id="projects">
      <h2 data-i="n_projects"></h2>
      <div class="grid" id="projGrid"></div>
    </section>

    <section id="services">
      <h2 data-i="n_services"></h2>
      <div class="grid" id="svcGrid"></div>
    </section>

    <section id="contact">
      <h2 data-i="n_contact"></h2>
      <form id="cf" novalidate>
        <input id="f_name" name="name" autocomplete="name" data-ph="f_name" required>
        <input id="f_email" name="email" type="email" autocomplete="email" data-ph="f_email" required>
        <input id="f_subj" name="subject" data-ph="f_subj" required>
        <textarea id="f_msg" name="message" rows="5" data-ph="f_msg" required></textarea>
        <div class="err" id="err" role="alert"></div>
        <button class="btn p" type="submit" data-i="send"></button>
      </form>
    </section>
  </main>
  <footer>© 2026 KERLOS AYMEN · DREAM. BUILD. INNOVATE.</footer>

  <script>
    // ---- Editable content (placeholders: replace with real details) ----
    var CONTACT_EMAIL = "ka5985174@gmail.com";
    var SKILLS = [["HTML", 80], ["CSS", 75], ["JavaScript", 65], ["React", 55], ["UI/UX Design", 60], ["Responsive Design", 75], ["Database Fundamentals", 45]];
    var PROJECTS = [
      { n: "TA3LEEM-APP", t: ["Web", "Learning"], en: "An education app that helps students learn and track progress.", ar: "تطبيق تعليمي يساعد الطلاب على التعلّم ومتابعة تقدمهم." },
      { n: "SUNDAY SCHOOL", t: ["Web", "Community"], en: "A digital space to organize lessons and activities for Sunday school.", ar: "مساحة رقمية لتنظيم دروس وأنشطة مدرسة الأحد." },
      { n: "CODEVERSE ACADEMY", t: ["Web", "Education"], en: "A coding academy concept for learning programming step by step.", ar: "فكرة أكاديمية برمجة لتعلّم البرمجة خطوة بخطوة." },
      { n: "DREAMORA 3D", t: ["3D", "Frontend"], en: "A 3D-driven web experience built around dreams and creativity.", ar: "تجربة ويب ثلاثية الأبعاد مبنية على الأحلام والإبداع." }
    ];
    var SERVICES = [
      { en: ["Website Development", "Complete websites, from idea to launch."], ar: ["تطوير المواقع", "مواقع كاملة من الفكرة حتى الإطلاق."] },
      { en: ["Frontend Development", "Fast, clean interfaces built with modern tools."], ar: ["تطوير الواجهات الأمامية", "واجهات سريعة ونظيفة بأدوات حديثة."] },
      { en: ["UI/UX Design", "Layouts that are clear, usable and memorable."], ar: ["تصميم UI/UX", "تصاميم واضحة وسهلة الاستخدام ولا تُنسى."] },
      { en: ["Responsive Web Design", "Pages that work on phone, tablet and desktop."], ar: ["تصميم مواقع متجاوبة", "صفحات تعمل على الهاتف واللوحي والحاسوب."] }
    ];
    var T = {
      en: {
        n_home: "Home", n_about: "About Me", n_skills: "Skills", n_projects: "Projects", n_services: "Services", n_contact: "Contact",
        role: "Web Developer | Programmer | Tech Enthusiast", lead: "Building digital experiences and turning ideas into reality.",
        b_proj: "Explore My Projects", b_contact: "Contact Me",
        about: "I’m Kerlos, a young web developer who loves programming and technology. I enjoy turning ideas into working websites and apps, and I’m always learning new tools to build better digital products.",
        skillNote: "Levels show where I am today while I keep learning.",
        f_name: "Name", f_email: "Email", f_subj: "Subject", f_msg: "Message", send: "Send message",
        e_req: "Please fill in every field.", e_mail: "Enter a valid email address.", ok: "Your email app opened with the message ready to send.", live: "Live demo", code: "GitHub"
      },
      ar: {
        n_home: "الرئيسية", n_about: "من أنا", n_skills: "المهارات", n_projects: "المشاريع", n_services: "الخدمات", n_contact: "تواصل معي",
        role: "مطوّر ويب | مبرمج | شغوف بالتكنولوجيا", lead: "أبني تجارب رقمية وأحوّل الأفكار إلى واقع.",
        b_proj: "استكشف مشاريعي", b_contact: "تواصل معي",
        about: "أنا كيرلس، مطوّر ويب شاب أحب البرمجة والتكنولوجيا. أستمتع بتحويل الأفكار إلى مواقع وتطبيقات تعمل، وأتعلّم أدوات جديدة دائمًا لأبني منتجات رقمية أفضل.",
        skillNote: "المستويات تعبّر عن مكاني اليوم وأنا أواصل التعلّم.",
        f_name: "الاسم", f_email: "البريد الإلكتروني", f_subj: "الموضوع", f_msg: "الرسالة", send: "إرسال الرسالة",
        e_req: "من فضلك املأ كل الحقول.", e_mail: "أدخل بريدًا إلكترونيًا صحيحًا.", ok: "فُتح تطبيق البريد والرسالة جاهزة للإرسال.", live: "عرض مباشر", code: "GitHub"
      }
    };
    var lang = "en";
    try { lang = localStorage.getItem("lang") || "en"; } catch (e) { }

    function render() {
      var t = T[lang], d = document.documentElement;
      d.lang = lang; d.dir = lang === "ar" ? "rtl" : "ltr";
      document.querySelectorAll("[data-i]").forEach(function (el) { el.textContent = t[el.dataset.i]; });
      document.querySelectorAll("[data-ph]").forEach(function (el) { el.placeholder = t[el.dataset.ph]; el.setAttribute("aria-label", t[el.dataset.ph]); });
      document.getElementById("lang").textContent = lang === "ar" ? "English" : "العربية";
      document.getElementById("skillGrid").innerHTML = SKILLS.map(function (s) {
        return '<div class="glass skill"><div><span>' + s[0] + '</span><span>' + s[1] + '%</span></div><div class="bar"><b data-w="' + s[1] + '"></b></div></div>';
      }).join("");
      document.getElementById("projGrid").innerHTML = PROJECTS.map(function (p) {
        return '<article class="glass"><h3>' + p.n + '</h3><p>' + p[lang] + '</p><div class="chips">' + p.t.map(function (x) { return "<span>" + x + "</span>" }).join("") + '</div></article>';
      }).join("");
      document.getElementById("svcGrid").innerHTML = SERVICES.map(function (s) {
        return '<article class="glass"><h3>' + s[lang][0] + '</h3><p>' + s[lang][1] + '</p></article>';
      }).join("");
      observeBars();
    }
    function observeBars() {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { e.target.style.width = e.target.dataset.w + "%"; io.unobserve(e.target); } });
      }, { threshold: .4 });
      document.querySelectorAll(".bar b").forEach(function (b) { io.observe(b); });
    }
    document.getElementById("lang").addEventListener("click", function () {
      lang = lang === "en" ? "ar" : "en";
      try { localStorage.setItem("lang", lang); } catch (e) { }
      render();
    });
    document.getElementById("cf").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var t = T[lang], v = function (id) { return document.getElementById(id).value.trim(); };
      var err = document.getElementById("err");
      if (!v("f_name") || !v("f_email") || !v("f_subj") || !v("f_msg")) { err.textContent = t.e_req; return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("f_email"))) { err.textContent = t.e_mail; return; }
      err.textContent = "";
      var body = v("f_msg") + "\n\n— " + v("f_name") + " (" + v("f_email") + ")";
      location.href = "mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent(v("f_subj")) + "&body=" + encodeURIComponent(body);
      err.style.color = "#9BE8C5"; err.textContent = t.ok;
    });
    render();
  </script>
</body>

</html>
